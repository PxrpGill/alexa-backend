name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: alexa
          POSTGRES_USER: alexa
          POSTGRES_PASSWORD: alexa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alexa" --health-interval 10s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s
          --health-timeout 5s --health-retries 5

    env:
      SECRET_KEY: ci-only-not-a-real-secret
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: alexa
      DB_USER: alexa
      DB_PASSWORD: alexa
      CELERY_BROKER_URL: redis://localhost:6379/0
      REDIS_URL: redis://localhost:6379/1
      DJANGO_SETTINGS_MODULE: config.settings.dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django checks
        run: python manage.py check --deploy --fail-level ERROR

      - name: Tests
        run: python manage.py test -v 2

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set IMAGE_NAME to lowercase
        run: echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/prod/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: GHCR_TOKEN,GHCR_USER
          script: |
            set -e
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            git config --global --add safe.directory /opt/alexa-backend || true
            if command -v docker-compose >/dev/null 2>&1; then
              DC() { docker-compose "$@"; }
            else
              DC() { docker compose "$@"; }
            fi
            cd /opt/alexa-backend
            git pull origin main
            # docker/prod/.env compose читает сам; export — запасной путь,
            # если на сервере этого файла ещё нет (значения лежат в .env.prod)
            export DOCKER_IMAGE=$(grep '^DOCKER_IMAGE=' docker/prod/.env.prod | cut -d= -f2-)
            export DOMAIN=$(grep '^DOMAIN=' docker/prod/.env.prod | cut -d= -f2-)
            DC -f docker/prod/docker-compose.yml pull web
            DC -f docker/prod/docker-compose.yml up -d
            DC -f docker/prod/docker-compose.yml exec -T web python manage.py migrate --noinput
            DC -f docker/prod/docker-compose.yml exec -T web python manage.py collectstatic --noinput
            # web пересоздан и получил новый IP в docker-сети — заставляем nginx
            # перечитать конфиг и заново отрезолвить upstream, иначе он отдаёт 502.
            DC -f docker/prod/docker-compose.yml exec -T nginx nginx -s reload
            DC -f docker/prod/docker-compose.yml ps
            docker image prune -f
