# ВНИМАНИЕ: на сервере этот файл помечен `git update-index --skip-worktree`
# (в него вручную подставлен домен), поэтому правки из репозитория НЕ попадают
# в прод автоматически — их нужно перенести на VPS руками. См. docs/deploy.md §7.2.

# Встроенный DNS-резолвер Docker. Без него nginx резолвит имя `web` один раз при
# старте и держит IP до перезапуска: после деплоя контейнер web получает новый
# адрес, а nginx продолжает отдавать 502, пока его не перезапустят вручную.
resolver 127.0.0.11 valid=10s ipv6=off;

# Лимиты по IP: подбор пароля в админке и флуд заявками.
# Пустой ключ = запрос не учитывается, поэтому api_write считает только POST —
# публичные GET-эндпоинты (врачи, блог, акции) не должны попадать под лимит.
map $request_method $api_write_key {
    default "";
    POST    $binary_remote_addr;
}

limit_req_zone $binary_remote_addr zone=admin_login:10m rate=5r/m;
limit_req_zone $api_write_key      zone=api_write:10m  rate=30r/m;
limit_req_status 429;

# Запросы с чужим/пустым Host не должны доходить до приложения.
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

server {
    listen 80;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    ssl_certificate         /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/YOUR_DOMAIN/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 20M;

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    # Резюме — персональные данные, отдаём только через Django (проверка прав
    # staff + X-Accel-Redirect). Прямые ссылки на /media/vacancies/resumes/ → 404.
    location /media/vacancies/resumes/ {
        internal;
        alias /app/media/vacancies/resumes/;
    }

    location /media/ {
        alias /app/media/;
        add_header X-Content-Type-Options nosniff always;
    }

    location = /admin/login/ {
        limit_req zone=admin_login burst=5 nodelay;
        include /etc/nginx/conf.d/proxy_to_web.inc;
    }

    location /api/v1/ {
        limit_req zone=api_write burst=10 nodelay;
        include /etc/nginx/conf.d/proxy_to_web.inc;
    }

    location / {
        include /etc/nginx/conf.d/proxy_to_web.inc;
    }
}
