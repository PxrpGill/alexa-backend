# Имя проекта закреплено ровно тем, которое docker-compose вычисляет сейчас
# (каталог compose-файла = `prod`), чтобы переименование каталога не создало
# новый проект с ПУСТЫМИ томами. Менять только вместе с миграцией томов
# prod_postgres_data / prod_media_volume — см. docs/deploy.md.
name: prod

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:16-alpine
    restart: always
    env_file: .env.prod
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: always
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    image: ${DOCKER_IMAGE}
    restart: always
    command:
      - gunicorn
      - config.wsgi:application
      - --bind=0.0.0.0:8000
      - --workers=3
      - --timeout=60
      - --graceful-timeout=30
      - --access-logfile=-
    env_file: .env.prod
    environment:
      DB_HOST: db
      DJANGO_SETTINGS_MODULE: config.settings.prod
    logging: *default-logging
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), timeout=5)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media

  worker:
    image: ${DOCKER_IMAGE}
    restart: always
    command: celery -A config worker -l info
    env_file: .env.prod
    environment:
      DB_HOST: db
      DJANGO_SETTINGS_MODULE: config.settings.prod
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media_volume:/app/media

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    # Перезагружаем конфиг раз в 6 часов: иначе nginx продолжает отдавать
    # старый сертификат после `certbot renew` до ручного перезапуска.
    #
    # ВАЖНО: nginx запускается через `exec /docker-entrypoint.sh nginx ...`, а не
    # напрямую. Штатный entrypoint выполняет /docker-entrypoint.d/* (в том числе
    # envsubst по шаблонам из /etc/nginx/templates) только когда его первый
    # аргумент — `nginx`. Если стартовать `nginx -g` напрямую, подстановка
    # ${DOMAIN} не произойдёт и контейнер поднимется со штатным default.conf
    # образа, то есть без HTTPS.
    command: /bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & exec /docker-entrypoint.sh nginx -g "daemon off;"'
    logging: *default-logging
    environment:
      # Домен берётся из docker/prod/.env.prod (деплой его экспортирует).
      # `:?` — деплой падает с понятной ошибкой, а не поднимает nginx с пустым
      # server_name и битыми путями к сертификатам.
      DOMAIN: ${DOMAIN:?не задан DOMAIN — добавьте его в docker/prod/.env.prod}
      NGINX_ENVSUBST_FILTER: DOMAIN
    volumes:
      - ./nginx:/etc/nginx/templates:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - web

  certbot:
    image: certbot/certbot
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done'"

volumes:
  postgres_data:
  static_volume:
  media_volume:
  certbot_certs:
  certbot_www:
