version: '3.9'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: alexa
      POSTGRES_USER: alexa
      POSTGRES_PASSWORD: alexa
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  web:
    build:
      context: ../..
      dockerfile: docker/dev/Dockerfile
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ../..:/app
    ports:
      - "8000:8000"
    env_file:
      - .env.dev
    environment:
      DB_HOST: db
      DJANGO_SETTINGS_MODULE: config.settings.dev
    depends_on:
      - db
      - redis

  worker:
    build:
      context: ../..
      dockerfile: docker/dev/Dockerfile
    command: celery -A config worker -l info
    volumes:
      - ../..:/app
    env_file:
      - .env.dev
    environment:
      DB_HOST: db
      DJANGO_SETTINGS_MODULE: config.settings.dev
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
